name: Feature
description: 사용자 가치가 있는 기능 작업
title: "[Feature] "
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 사용자 결과
      description: 구현물이 아니라 사용자가 얻게 될 결과를 작성합니다.
      placeholder: 현장 송출자는 네트워크가 복구되면 조작 없이 송출을 재개한다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함하는 것과 포함하지 않는 것을 구분합니다.
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: 계층과 의존성
      description: domain/application/infrastructure/hooks/ui 변경과 주입할 interface를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 검증 가능한 Given/When/Then 또는 체크리스트를 작성합니다.
      placeholder: |
        - [ ] 오프라인 전환 시 reconnecting 상태가 표시된다.
        - [ ] 온라인 복구 시 정책에 따라 재연결한다.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: TDD 계획
      description: 먼저 실패할 테스트와 contract/UI/E2E 검증을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: 배포와 롤백
      description: feature flag, 호환성, 롤백 방법을 작성합니다.
