server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /publisher {
        return 308 /publisher/;
    }

    location /publisher/ {
        try_files $uri $uri/ /publisher/index.html;
    }

    location / {
        return 404;
    }
}
